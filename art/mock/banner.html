<!doctype html><html><head><meta charset="utf-8"><title>Banner</title>
<style>
:root{--u:#3d4eff;--l:#a78bfa;--t:#16162a;--t2:#4b4b63;--t3:#74748b;--line:#e4e4ef;--sub:#f8f8fc;--muted:#f0f0f7}
*{box-sizing:border-box}
body{margin:0;width:1000px;height:500px;overflow:hidden;font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:#fff;position:relative}
body:before{content:"";position:absolute;right:-80px;top:-60px;width:620px;height:620px;background:radial-gradient(closest-side,rgba(167,139,250,.22),transparent)}
.left{position:absolute;left:56px;top:50px;width:480px}
.brand{display:flex;align-items:center;gap:14px;font-size:18px;white-space:nowrap;font-weight:600;letter-spacing:-.02em}
.brand i{display:block;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--u),var(--l));position:relative}
.brand i:after{content:"";position:absolute;left:9px;top:8px;width:11px;height:11px;border-radius:50%;border:3px solid #fff;border-right-color:transparent;border-bottom-color:transparent}
.brand span{color:var(--t3);font-weight:400}
h1{font-size:40px;white-space:nowrap;line-height:1.05;letter-spacing:-.045em;font-weight:600;margin:46px 0 22px}
p{font-size:16px;line-height:1.5;color:var(--t2);margin:0 0 30px}
code{display:inline-block;background:var(--muted);border-radius:12px;padding:12px 18px;font:13px ui-monospace,Menlo,Consolas,monospace}
.win{position:absolute;left:560px;top:58px;width:520px;height:440px;border:1px solid var(--line);border-radius:14px 0 0 0;background:#fff;box-shadow:0 24px 60px -32px rgba(61,78,255,.6);overflow:hidden}
.win:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--u),var(--l))}
.win iframe{border:0;width:1280px;height:1000px;transform:scale(.4);transform-origin:0 0;margin-top:3px}
</style></head><body>
<div class="left"><div class="brand"><i></i>Security Alerts for Magento 2 <span>by Ruvelo</span></div>
<h1>Know before they do.</h1>
<p>Magento and extension vulnerabilities in your admin and inbox, loudest when they're exploited in the wild.</p>
<code>$ composer require ruvelo/magento2-security-alerts</code></div>
<div class="win"><iframe src="grid.html"></iframe></div>
</body></html>
